name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "collect_url_files*.py"
      - "requirements-build.txt"
      - "_fixture/**"
      - "README.md"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
      - name: Install build dependency
        run: python -m pip install -r requirements-build.txt
      - name: Check syntax
        run: python -m py_compile collect_url_files.py collect_url_files_core.py collect_url_files_gui.py
      - name: Check CLI fixtures
        run: python _fixture/verify.py
      - name: Check core fixtures
        run: python _fixture/verify_core.py
      - name: Build one-file GUI executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name CollectUrlFiles collect_url_files_gui.py
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: CollectUrlFiles-windows-x64
          path: dist/CollectUrlFiles.exe
          if-no-files-found: error
